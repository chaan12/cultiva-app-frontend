name: cultiva_app_frontend
description: App móvil de apoyo para gestión y seguimiento de cultivos.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  fl_chart: ^1.1.1
  connectivity_plus: ^7.0.0
  geocoding: ^3.0.0
  geolocator: ^13.0.4
  http: ^1.2.2
  intl: ^0.19.0
  open_filex: ^4.6.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/pdfs/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/logos/app_icon.png"
  remove_alpha_ios: true
